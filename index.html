<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
  
  <title>Frontend Mentor | Profile card component</title>

</head>
<body>

  <main class="main">

    <img class="bg-pattern-top bg-pattern" src="./assets/images/bg-pattern-top.svg" alt="bg-top">

    <div class="card">

      <img class="card-banner" src="./assets/images/bg-pattern-card.svg" alt="bg-banner">
      <img class="card-user" src="./assets/images/image-victor.jpg" alt="user">

      <div class="card-info">
        
        <p class="card-name">Victor Crest <span class="card-age">26</span></p>

        <p class="card-location">London</p>

      </div>

      <div class="card-status">

        <div class="card-status-item">

          <p class="card-status-number">80K</p>

          <p class="card-status-text">Followers</p>

        </div>

        <div class="card-status-item">

          <p class="card-status-number">803K</p>

          <p class="card-status-text">Likes</p>

        </div>

        <div class="card-status-item">

          <p class="card-status-number">1.4K</p>

          <p class="card-status-text">Photos</p>

        </div>
      </div>

    </div>

    <img class="bg-pattern-bottom bg-pattern" src="./assets/images/bg-pattern-bottom.svg" alt="bg-bottom">

    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://www.frontendmentor.io/profile/AlejandroLR00" target="_blank">AlejandroLR00</a>.
    </div>
    
  </main>

  
</body>
</html>
